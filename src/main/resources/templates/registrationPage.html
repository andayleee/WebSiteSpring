<body class="pt-0">
<div th:replace="~{blocks/header :: header}"></div>
<div class="container-fluid d-flex align-items-center justify-content-center mt-4">
  <div class="col-12 col-md-6 col-lg-5">
    <form class="p-4 border rounded shadow-sm bg-white" id="registerForm" th:action="@{/register}" method="post" th:object="${registerRequest}">
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Логин</label>
        <input type="text" th:field="*{email}" name="email" class="form-control" placeholder="Email or nickname" required>
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Пароль</label>
        <input type="password" th:field="*{password}" name="password" class="form-control" placeholder="Password" required>
      </div>

      <div class="mb-4">
        <label for="exampleInputPassword1" class="form-label">Ключ доступа</label>
        <input type="password" th:field="*{accessKey}" name="accessKey"  class="form-control" placeholder="Access key" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">
        Регистрация
      </button>
      <a th:href="@{/login}">Есть учётная запись? Авторизация</a>

      <div class="toast-container position-fixed bottom-0 end-0 p-3"
        th:if="${error}">
        <div class="toast show"
            role="alert"
            aria-live="assertive"
            aria-atomic="true">
          <div class="toast-header">
            <strong class="me-auto text-danger">Ошибка регистрации</strong>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="toast"
                    aria-label="Close"></button>
          </div>
          <div class="toast-body" th:text="${error}">
            
          </div>
      </div>
    </form>
  </div>
</div>
</body>
