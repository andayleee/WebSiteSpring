    :root {
      --primary: #6366f1;
      --secondary: #f59e0b;
    }

</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
<div th:replace="~{blocks/header :: header}"></div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Изменение пароля</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Введите новый пароль</label>
            <input type="password" class="form-control" id="newPassword">
          </div>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Повторите новый пароль</label>
            <input type="password" class="form-control" id="repeatNewPassword">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="px-6 py-2 rounded-full border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition-all" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn-gradient px-6 py-2 rounded-full text-white font-medium hover:shadow-lg transition-all flex items-center" id="saveNewPassword">
          <i data-feather="save" class="mr-2"></i> Сохранить
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container mx-auto px-4 py-8 max-w-6xl">
  <div class="bg-white rounded-xl shadow-lg overflow-hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8">
      <!-- Аватар -->
      <div class="flex flex-col items-center">
        <div class="relative group w-48 h-48 md:w-56 md:h-56 mb-6 avatar-hover rounded-full">
          <div id="photoLoader" class="absolute inset-0 flex items-center justify-center bg-secondary bg-opacity-20 rounded-full">
              <div class="spinner-border text-white" role="status">
                  <span class="visually-hidden">Loading...</span>
              </div>
          </div>

          <img th:src="@{${user.photoPath} + '?v=' + ${#dates.format(#dates.createNow(), 'yyyyMMddHHmmss')}}" 
              alt="Фото профиля"
              class="w-full h-full rounded-full object-cover shadow-md border-4 border-white transition-all duration-300 group-hover:border-indigo-300 cursor-pointer"
              id="userPhoto">
      </div>
      <div class="d-flex justify-content-center align-items-center flex-wrap gap-3">
        <button class="d-inline btn-gradient px-6 py-2 rounded-full text-white font-medium hover:shadow-lg transition-all" id="editProfileBtn">
          <i class="mr-2"></i> Редактировать профиль
        </button>
        <form class="d-inline" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" id="logOutBtn">
          <button type="submit" class="px-6 py-2 rounded-full border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition-all">Выйти</button>
        </form>
        <button type="button" class="d-none btn-gradient px-6 py-2 rounded-full text-white font-medium hover:shadow-lg transition-all" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@mdo" id="editPasswordBtn">Изменить пароль</button>
      </div>
        <!-- Модалка фото -->
        <div class="modal fade overflow-hidden" id="photoModal" tabindex="-1" aria-labelledby="photoModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered modal-xl" style="margin-top: 1rem; margin-bottom: 1rem;">
            <div class="modal-content bg-transparent border-0 position-relative">
              <div class="modal-body d-flex justify-content-center align-items-center p-0 position-relative">
                <div id="imageContainer" class="position-relative d-flex justify-content-center align-items-center min-vh-75 max-vh-75">
                  <img id="photoModalImg" class="img-fluid rounded-lg" 
                      style="object-fit: contain; max-height: 85vh; min-height: 70vh;">
                  <button type="button" class="btn-close btn-close-white position-absolute top-3 end-3 bg-white rounded-full p-2" data-bs-dismiss="modal" aria-label="Close"></button>

                </div>
                
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Колонка инфы -->
      <div class="flex flex-col justify-center">
        <div class="profile-view" id="profileView">
          <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2" th:text="${user.getName()}">Имя</h1>
          <div class="flex items-center text-indigo-600 mb-4">
            <i data-feather="user" class="mr-2"></i>
            <h2 class="text-lg" th:text="${user.getEmail()}">Логин</h2>
          </div>
          <div class="bg-gray-50 rounded-lg p-4 mb-6">
            <div class="flex items-start">
              <i data-feather="info" class="text-indigo-500 mr-3 mt-1"></i>
              <p class="text-gray-600" th:text="${user.getDescription()} ?: 'Пока нет описания профиля'">Описание</p>
            </div>
          </div>
        </div>

        <!-- Форма редактирования -->
        <form th:action="@{/account/update}" method="post" enctype="multipart/form-data" class="profile-edit d-none" id="profileEdit">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="space-y-4">
            <div>
              <label for="nameInput" class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
              <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" 
                     id="nameInput" name="name" th:value="${user.getName()}" required>
            </div>
            <div>
              <label for="emailInput" class="block text-sm font-medium text-gray-700 mb-1">Логин (Email)</label>
              <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" 
                     id="emailInput" name="email" th:value="${user.getEmail()}" required>
            </div>
            <div>
              <label for="descInput" class="block text-sm font-medium text-gray-700 mb-1">Описание</label>
              <textarea class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" 
                        id="descInput" name="description" rows="3" th:text="${user.getDescription()}"></textarea>
            </div>
            <div>
              <label for="photoInput" class="block text-sm font-medium text-gray-700 mb-1">Аватарка</label>
              <div class="flex items-center space-x-4">
                <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition flex items-center">
                  <i data-feather="upload" class="mr-2"></i>
                  Выбрать файл
                  <input type="file" class="hidden" id="photoInput" name="photo" accept="image/*" onchange="validateFileSize(this)">
                </label>
                <span class="text-sm text-gray-500" id="fileName">Файл не выбран</span>
              </div>
            </div>
            <div class="flex space-x-3 pt-2">
              <button type="submit" class="btn-gradient px-6 py-2 rounded-full text-white font-medium hover:shadow-lg transition-all flex items-center">
                <i data-feather="save" class="mr-2"></i> Сохранить
              </button>
              <button type="button" class="px-6 py-2 rounded-full border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition-all" id="cancelEditBtn">
                Отмена
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Секция постов -->
<div class="container mx-auto px-4 py-8 max-w-6xl">
  <div class="bg-white rounded-xl shadow-lg overflow-hidden p-6 mb-8 ">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Создать новый пост</h2>
    <form id="postForm" method="post" action="/posts/create" enctype="multipart/form-data" class="space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="flex items-center space-x-4">
        <div id="imagePreviewContainer" class="hidden items-center space-x-2">
            <div class="relative">
                <img id="imagePreview" 
                    src="" 
                    alt="Предпросмотр" 
                    class="w-24 h-24 object-cover rounded-lg border border-gray-300">
                <button type="button" 
                        id="imagePreviewRemoveBtn"
                        class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600">
                    ×
                </button>
            </div>
        </div>
        <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg flex items-center">
            Выбрать файл
            <input type="file" 
                  id="postImage" 
                  name="image" 
                  accept="image/*" 
                  class="hidden" 
                  onchange="previewImage(this)">
        </label>
        <span id="selectedImageName" class="text-sm text-gray-500">Файл не выбран</span>
    </div>

      <div>
          <label for="postCaption" class="block text-sm font-medium text-gray-700 mb-1">Подпись</label>
          <input type="text" id="postCaption" name="postCaption"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="Добавьте подпись...">
      </div>

      <div>
          <label for="postDescription" class="block text-sm font-medium text-gray-700 mb-1">Описание</label>
          <textarea id="postDescription" name="postDescription"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    rows="3" placeholder="Расскажите что-нибудь..."></textarea>
      </div>

      <button type="submit" class="btn-gradient px-6 py-2 rounded-full text-white font-medium flex items-center" id="postPost">
          Опубликовать
      </button>
  </form>
</div>

  <h2 class="text-2xl font-bold text-gray-800 mb-6">Мои посты</h2>
  
  <!-- Посты -->
  <div id="postsContainer" class="space-y-6">
    <div th:each="post : ${posts}" class="post-item bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="d-flex justify-content-center w-100" th:if="${post.photoPath != null and !#strings.isEmpty(post.photoPath)}">
          <img th:src="@{${post.photoPath}}" 
              alt="Post image" 
              class="object-fit-contain cursor-pointer" 
              style="max-height: 500px; min-height: 400px;">
      </div>
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center">
            <img th:src="@{${user.photoPath}}" alt="User" id="userPostPhoto" class="w-10 h-10 object-cover rounded-full mr-3">
            <div>
              <h3 class="font-bold text-gray-800" th:text="${user.name}">Имя</h3>
              <h6 class="text-sm text-gray-500" th:text="${postTimes[post.id]}"></h6>
            </div>
          </div>
         <div class="relative">
            <button class="text-gray-400 hover:text-gray-600 more-btn">
                <i data-feather="more-vertical"></i>
            </button>
            <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden more-menu">
                <button class="edit-post-btn block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                  <div class="row">
                    <div class="col-2">
                      <i data-feather="edit-2" class="w-4 h-4 mr-2"></i>
                    </div>
                    <div class="col-10">
                      <p>Изменить</p>
                    </div>
                  </div>
                </button>
                <form th:action="@{/posts/delete}" method="post">
                    <input type="hidden" th:name="postId" th:value="${post.id}" />
                    <button type="submit" class="text-gray-400 hover:text-red-500 block w-full text-left px-4 py-2 text-sm ">
                        <div class="row">
                          <div class="col-2">
                            <i data-feather="trash-2" class="w-4 h-4 mr-2"></i>
                          </div>
                          <div class="col-10">
                            <p>Удалить</p>
                          </div>
                        </div>
                    </button>
                </form>
            </div>
        </div>
        </div>
        
        <h4 class="font-semibold text-lg mb-2" th:text="${post.title}">Заголовок поста</h4>
        <p class="text-gray-600 mb-4"><span class="post-description text-break whitespace-pre-line" th:text="${post.description}">Описание поста</span></p>
        <form class="edit-post-form hidden mt-3 mb-3 space-y-3 rounded-lg" th:attr="data-post-id=${post.id}">
            <input type="text" name="title" class="w-full px-4 py-2 border rounded-lg" placeholder="Заголовок" th:value="${post.title}">
            <textarea name="description" class="w-full px-4 py-2 border rounded-lg" rows="3" placeholder="Описание" th:text="${post.description}"></textarea>
            <div class="flex space-x-2">
                <button type="submit" class="bg-indigo-500 text-white px-4 py-2 rounded-lg hover:bg-indigo-600">Сохранить</button>
                <button type="button" class="cancel-edit-post-btn px-4 py-2 rounded-lg border hover:bg-gray-100">Отмена</button>
            </div>
        </form>

        
        <div class="flex items-center space-x-4 border-t border-gray-100 pt-4">
            <button class="like-btn flex items-center hover:text-red-500"
                    th:data-post-id="${post.id}"
                    th:classappend="${post.isLikedBy(user)} ? 'text-red-500' : 'text-gray-500'">
                <i data-feather="heart" class="mr-2"></i>
                <span class="like-count" th:text="${post.likes.size()}">0</span>
            </button>
            <button class="flex items-center text-gray-500 hover:text-indigo-500">
                <i data-feather="message-square" class="mr-2"></i>
            </button>
        </div>
        <!-- Добавление коммента -->
        <form class="mt-4 flex add-comment-form" th:data-post-id="${post.id}">
            <input type="text"  id="comment-input" name="content" placeholder="Напишите комментарий..." 
                  class="flex-1 px-4 py-2 rounded-l-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition text-sm"
                  required>
            <button type="submit" class="bg-indigo-500 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-600 transition">
                <i data-feather="send" class="w-4 h-4"></i>
            </button>
        </form>
        <!-- Секция комментов -->
        <div class="mt-4 space-y-3 comments-section" th:data-post-id="${post.id}" th:data-total-comments="${postCommentsCount[post.id]}">
          <div th:each="comment : ${postComments[post.id]}" class="flex" th:data-comment-id="${comment.id}">
              <img th:src="@{${comment.user.photoPath}}" id="userPostPhoto" alt="Commenter" class="w-8 h-8 object-cover rounded-full mr-3">
              <div class="bg-gray-50 p-3 rounded-lg flex-1 relative">
                  <div class="flex items-center justify-between">
                    <a th:href="@{'/user/' + ${comment.user.id}}" class="flex items-center">
                      <span class="font-medium fw-bold text-sm" th:text="${comment.user.name}">Пользователь</span>
                    </a>
                      <span class="text-xs text-gray-400" th:text="${#temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm')}">Когда</span>
                  </div>
                  <p class="text-sm mt-1 break-words" th:text="${comment.content}">Комментарий</p>

                   <div class="absolute bottom-1 right-3">
                      <button th:if="${comment.user.id != user.id}" 
                              class="text-secondary text-xs text-hover-dark answer-comment-btn">
                          Ответить
                      </button>
                      <button th:if="${comment.user.id == user.id}" 
                              class="text-red-500 text-xs hover:text-red-700 delete-comment-btn">
                          Удалить
                      </button>
                   </div>
                  
              </div>
          </div>
      </div>

      <button class="show-more-comments-btn mt-3" th:data-post-id="${post.id}" 
        th:if="${postCommentsCount[post.id] > 3}">Показать еще</button>

      </div>
    </div>
  </div>
  <div id="loadMoreBtn" class="bg-white rounded-xl shadow-lg overflow-hidden p-4 mt-4 text-center cursor-pointer hover:bg-gray-50 transition">
    <div class="flex flex-col items-center">
      <p class="text-lg font-medium text-gray-700 mb-2">Когда-то здесь будет пагинация</p>
      <div class="w-6 h-6 relative">
        <div class="absolute top-0 left-0 w-4 h-0.5 bg-gray-400 transform rotate-45 origin-bottom-left"></div>
        <div class="absolute top-0 right-0 w-4 h-0.5 bg-gray-400 transform -rotate-45 origin-bottom-right"></div>
      </div>
    </div>
  </div>
</div>

<!-- тост -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
    <div id="fileSizeToast" th:class="'toast align-items-center border-0 fade hide ' + 
                   (${toastType == 'error'} ? 'text-bg-danger' : 'text-bg-success')" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">Файл слишком большой! Максимальный размер 20MB.</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script th:src="@{/js/profileScript.js}"></script>
<script th:src="@{/js/profileAddCommentScript.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script>
  feather.replace();
</script>
</body>
</html>
