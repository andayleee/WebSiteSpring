<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
<div th:replace="~{blocks/header :: header}"></div>

<div class="container mx-auto px-4 py-8 max-w-6xl">
  <div class="mt-4 mb-6 flex">
      <input type="text" id="searchInput" placeholder="Поиск пользователей по имени или email" 
            class="flex-1 px-4 py-2 rounded-l-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition text-base"
            autocomplete="off">
      <button id="usersSearchBtn" class="bg-indigo-500 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-600 transition font-medium">
          <i data-feather="search" class="w-5 h-5"></i>
      </button>
  </div>
  
  <div id="defaultState" class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Возможные друзья</h2>
  </div>
  
  <div id="searchState" class="mb-6 hidden">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Результаты поиска</h2>
  </div>
  
  <div id="backToRandom" class="mb-4 hidden">
    <button id="backBtn" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center">
      <i data-feather="arrow-left" class="w-4 h-4 mr-2"></i>
      Вернуться к случайным пользователям
    </button>
  </div>
  
  <div class="bg-white rounded-xl shadow-lg overflow-hidden parent relative">
    <div id="usersPreloader" class="absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center z-10 hidden">
      <div class="text-center">
        <div class="spinner border-4 border-t-indigo-600 border-gray-200 rounded-full w-16 h-16 animate-spin mx-auto"></div>
        <p class="mt-4 text-gray-600">Поиск пользователей...</p>
      </div>
    </div>
    
    <div id="noResults" class="hidden p-8 text-center">
      <i data-feather="users" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
      <h3 class="text-xl font-semibold text-gray-700 mb-2">Пользователи не найдены</h3>
      <p class="text-gray-500">Попробуйте изменить поисковый запрос</p>
    </div>
    
    <div id="usersContainer">
      <div id="randomUsers">
        <div th:each="user : ${users}" class="group relative p-6 border-b hover:bg-gray-50 transition">
          <a th:href="@{'/user/' + ${user.id}}" class="flex items-center">
            <img th:src="@{${user.photoPath}}" alt="User" class="w-12 h-12 object-cover rounded-full mr-4">
            <div>
              <h3 class="text-lg font-semibold text-gray-800" th:text="${user.name}"></h3>
              <p class="text-gray-600 text-sm" th:text="${user.email}"></p>
            </div>
          </a>
        </div>
      </div>
      
      <div id="searchResults" class="hidden"></div>
    </div>
  </div>
</div>

<script th:src="@{/js/usersScript.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script>
  feather.replace();
</script>
</body>
