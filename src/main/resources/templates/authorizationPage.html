<body class="pt-0">
<div th:replace="~{blocks/header :: header}"></div>
<div class="container-fluid d-flex align-items-center justify-content-center mt-4">
  <div class="col-12 col-md-6 col-lg-5">
    <form th:action="@{/login}" method="post" class="p-4 border rounded shadow-sm bg-white">
      <h4 class="mb-3 text-xl-start">Вход</h4>
      <p>Авторизация предоставит доступ к МемоЛенте, где собраны только самые отборные мемы всех пользователей!</p>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Логин</label>
        <input type="text" name="username" placeholder="Email or nickname" class="form-control" id="exampleInputEmail1" required>
      </div>

      <div class="mb-4">
        <label for="exampleInputPassword1" class="form-label">Пароль</label>
        <input type="password" name="password" placeholder="Password" class="form-control" id="exampleInputPassword1" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">
        Войти
      </button>
      <a th:href="@{/registration}">Нет учётной записи? Регистрация</a>
    </form>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3"
     th:if="${param.error}">
    <div class="toast show"
        role="alert"
        aria-live="assertive"
        aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto text-danger">Ошибка авторизации</strong>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="toast"
                aria-label="Close"></button>
      </div>
      <div class="toast-body">
        Неверный логин или пароль
      </div>
  </div>
</div>
</div>
<script th:src="@{/js/homeScript.js}"></script>
</body>
