<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>andayleee - Админ панель</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="stylesheet" type="text/css" th:href="@{/css/homeStyle.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f3f4f6;
    }
    .container-fluid {
      min-height: 100%;
    }
  </style>
</head>
<body class="pt-0" style="height: 100%;">
<div th:replace="~{blocks/header :: header}"></div>
<div class="container-fluid d-flex align-items-center justify-content-center mt-4">
  <div class="container mt-4 mb-5">
    <h1 class="mb-4">Main Page Items</h1>

    <!-- Форма добавления -->
    <form th:action="@{/admin/page/add}" method="post" enctype="multipart/form-data" class="mb-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="mb-3">
            <label>Фото:</label>
            <input type="file" name="photo" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Заголовок:</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Описание:</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
    </form>

    <table class="table table-striped table-hover table-bordered align-middle w-100">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Фото</th>
                <th>Заголовок</th>
                <th>Описание</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item, iterStat : ${items}">
                <form th:action="@{/admin/page/update}" method="post" class="d-flex align-items-center w-100">
                    <input type="hidden" name="id" th:value="${item.id}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <th th:text="${iterStat.count}" style="width: 40px;"></th>

                    <td style="width: 120px;">
                        <img th:src="${item.photoPath}" th:alt="${item.title}" style="max-height:100px; object-fit:cover;">
                    </td>

                    <td class="px-1 flex-grow-1">
                        <input type="text" name="title" th:value="${item.title}" class="form-control form-control-sm w-100" />
                    </td>

                    <td class="px-1 flex-grow-1">
                        <input type="text" name="description" th:value="${item.description}" class="form-control form-control-sm w-100" />
                    </td>

                    <td class="text-center px-1" style="width: 50px; min-width: 50px;">
                        <button type="submit" class="btn btn-sm btn-success" title="Изменить">
                            <i data-feather="edit"></i>
                        </button>
                    </td>
                </form>

                <!-- Форма удаления -->
                <td class="text-center px-1" style="width: 50px; min-width: 50px;">
                    <form th:action="@{/admin/page/delete}" method="post"
                        onsubmit="return confirm('Вы уверены, что хотите удалить этот элемент?');">
                        <input type="hidden" name="id" th:value="${item.id}" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-sm btn-danger" title="Удалить">
                            <i data-feather="trash-2"></i>
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
  </div>
</div>
</div>
<script th:src="@{/js/homeScript.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/feather-icons"></script>
<script>
    feather.replace();
</script>
</body>
</html>
